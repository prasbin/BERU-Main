name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The project lives in the BERU/ subdirectory of the repository, so every
# run step must execute there (GitHub Actions only discovers workflows from
# the repository root).
defaults:
  run:
    working-directory: BERU

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -r requirements-dev.lock

      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      - name: Run tests
        run: pytest --tb=short -q

  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beru_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      - name: Run tests against PostgreSQL
        env:
          BERU_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/beru_test
        run: pytest --tb=short -q
# ============================================================================
# BERU — Alembic configuration
# ----------------------------------------------------------------------------
# The database URL is intentionally left blank below. `migrations/env.py`
# derives it from BERU's application settings (DATABASE_URL), converted to a
# synchronous driver, so there is a single source of truth and no secret is
# ever hardcoded here. Run migrations from the project root, e.g.:
#
#     alembic upgrade head
#     alembic revision --autogenerate -m "describe change"
#
# The application also applies migrations automatically at startup.
# ============================================================================

[alembic]
# Location of the migration environment and version scripts (relative to root).
script_location = migrations

# Prepend the project root to sys.path so `backend` is importable from the CLI.
prepend_sys_path = .

# Use OS-native path separators for version file paths on Windows.
version_path_separator = os

# Resolved at runtime in env.py from application settings — do not hardcode.
sqlalchemy.url =


# ---- Logging --------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beru
      POSTGRES_PASSWORD: beru
      POSTGRES_DB: beru
    ports:
      - "5432:5432"
    volumes:
      - beru-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beru -d beru"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  beru-pgdata:
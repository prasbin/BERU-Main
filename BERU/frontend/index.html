<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BERU - Personal AI Operating System</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --accent: #00ff88;
            --accent-dim: #00cc6a;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --border: #2a2a35;
            --error: #ff4444;
            --warning: #ffaa00;
            --ok: #00ff88;
            --limited: #ffaa00;
            --bad: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 60px 1fr;
            flex: 1;
            min-height: 0;
        }

        .header {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }

        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 32px; height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--bg-primary);
        }
        .logo-text { font-size: 1.4rem; font-weight: 600; letter-spacing: 2px; }

        .status-bar { display: flex; gap: 14px; margin-left: auto; align-items: center; flex-wrap: wrap; }

        .chip {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
        }
        .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
        .chip.ok .dot { background: var(--ok); }
        .chip.limited .dot { background: var(--limited); }
        .chip.bad .dot { background: var(--bad); }

        .banner-auth {
            display: none;
            background: var(--bg-tertiary);
            border: 1px solid var(--warning);
            border-radius: 8px;
            padding: 10px 14px;
            margin: 10px 14px 0;
            font-size: 0.85rem;
            align-items: center;
            gap: 10px;
        }
        .banner-auth.visible { display: flex; }
        .banner-auth input { flex: 1; padding: 6px 10px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); }
        .banner-auth .hint { color: var(--text-secondary); font-size: 0.75rem; }

        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 14px;
            gap: 16px;
        }

        .panel-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary); margin-bottom: 8px; }

        .agent-list { display: flex; flex-direction: column; gap: 8px; }
        .agent-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .agent-card:hover { border-color: var(--accent-dim); }
        .agent-card.active { border-color: var(--accent); }
        .agent-card .name { font-weight: 600; font-size: 0.9rem; }
        .agent-card .desc { font-size: 0.75rem; color: var(--text-secondary); margin-top: 3px; }
        .agent-card .caps { font-size: 0.68rem; color: var(--accent-dim); margin-top: 5px; }

        .quick-stat { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.8rem; }
        .quick-stat .row { display: flex; justify-content: space-between; padding: 3px 0; }
        .quick-stat .label { color: var(--text-secondary); }
        .quick-stat .value { color: var(--accent); font-weight: 600; }

        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-area { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user { align-self: flex-end; background: var(--accent-dim); color: #04120a; }
        .message.assistant { align-self: flex-start; background: var(--bg-tertiary); border: 1px solid var(--border); }
        .message.system { align-self: center; font-size: 0.78rem; color: var(--text-secondary); background: none; padding: 4px 8px; }
        .message.error { align-self: flex-start; background: rgba(255,68,68,0.12); border: 1px solid var(--error); color: var(--error); }
        .message .meta { font-size: 0.68rem; color: var(--text-secondary); margin-bottom: 4px; }

        .typing {
            align-self: flex-start;
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 6px 8px;
            display: none;
        }

        .input-area {
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .input-area input:focus { outline: none; border-color: var(--accent-dim); }
        .btn {
            background: var(--accent-dim);
            color: #04120a;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn:hover { background: var(--accent); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn.danger { background: rgba(255,68,68,0.15); color: var(--error); border: 1px solid var(--error); }
        .btn.small { padding: 4px 10px; font-size: 0.72rem; border-radius: 6px; }

        .right {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab {
            flex: 1;
            padding: 10px 4px;
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .tab-content { flex: 1; overflow-y: auto; padding: 12px; display: none; }
        .tab-content.active { display: block; }

        .item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 11px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .item .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .item .title { font-weight: 600; }
        .item .sub { color: var(--text-secondary); font-size: 0.72rem; margin-top: 3px; }
        .item .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

        .av { font-weight: 700; font-size: 0.8rem; }
        .av.available { color: var(--ok); }
        .av.limited { color: var(--limited); }
        .av.unavailable { color: var(--bad); }

        .form-row { margin-bottom: 8px; }
        .form-row label { display: block; font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 4px; }
        .form-row input, .form-row select, .form-row textarea {
            width: 100%;
            padding: 7px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.82rem;
        }

        .hint { font-size: 0.72rem; color: var(--text-secondary); }
        .ok-text { color: var(--ok); font-size: 0.8rem; font-weight: 600; }
        .bad-text { color: var(--error); font-size: 0.8rem; font-weight: 600; }
        .warn-text { color: var(--warning); font-size: 0.8rem; font-weight: 600; }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 50;
            align-items: flex-end;
            justify-content: center;
        }
        .overlay.visible { display: flex; }

        .confirm-modal {
            width: min(560px, 94vw);
            background: var(--bg-secondary);
            border: 1px solid var(--warning);
            border-radius: 14px;
            margin-bottom: 24px;
            padding: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .confirm-modal .title { font-weight: 700; margin-bottom: 10px; color: var(--warning); }
        .confirm-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .confirm-card .tool { color: var(--accent); font-weight: 600; font-family: monospace; }
        .confirm-card .args {
            background: var(--bg-primary);
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            font-family: monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 140px;
            overflow-y: auto;
            color: var(--text-secondary);
        }
        .confirm-card .actions { display: flex; gap: 10px; margin-top: 10px; }
        .confirm-card .result { font-size: 0.75rem; margin-top: 8px; }
        .confirm-card .result.approved { color: var(--ok); }
        .confirm-card .result.denied { color: var(--text-secondary); }
        .confirm-card .result.error { color: var(--error); }

        .table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
        .table th, .table td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
        .table th { color: var(--text-secondary); font-weight: 600; }

        .empty { color: var(--text-secondary); font-size: 0.78rem; padding: 12px 4px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <div id="banner-auth" class="banner-auth">
        <span>API access is secured. Enter your BERU API key to connect:</span>
        <input id="auth-key-input" type="password" placeholder="BERU API key" autocomplete="off">
        <button class="btn small" id="auth-login-btn">Connect</button>
        <span class="hint">Stored only for this tab session; never logged or placed in URLs.</span>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">B</div>
                <div class="logo-text">BERU</div>
            </div>
            <div class="status-bar">
                <span class="chip" id="chip-server"><span class="chip-label">Server</span> <span class="dot"></span></span>
                <span class="chip" id="chip-ws"><span class="chip-label">WebSocket</span> <span class="dot"></span></span>
                <span class="chip" id="chip-auth"><span class="chip-label">Auth</span> <span class="dot"></span></span>
                <span class="chip" id="chip-model"><span class="chip-label">Model</span> <span class="dot"></span></span>
            </div>
        </header>

        <aside class="sidebar" id="sidebar">
            <div>
                <div class="panel-title">Agents</div>
                <div class="agent-list" id="agent-list"></div>
            </div>
            <div>
                <div class="panel-title">Runtime</div>
                <div class="quick-stat" id="quick-stat"></div>
            </div>
        </aside>

        <main class="main">
            <div class="chat-area" id="chat-area"></div>
            <div class="typing" id="typing">BERU is typing...</div>
            <div class="input-area">
                <input id="message-input" type="text" placeholder="Message BERU..." autocomplete="off">
                <button class="btn secondary" id="new-chat-btn">New</button>
                <button class="btn" id="send-btn">Send</button>
            </div>
        </main>

        <aside class="right" id="right-panel">
            <div class="tabs" id="tabs">
                <div class="tab active" data-tab="tools">Tools</div>
                <div class="tab" data-tab="desktop">Desktop</div>
                <div class="tab" data-tab="browser">Browser</div>
                <div class="tab" data-tab="automation">Automation</div>
                <div class="tab" data-tab="memory">Memory</div>
                <div class="tab" data-tab="plans">Plans</div>
                <div class="tab" data-tab="notifications">Notify</div>
                <div class="tab" data-tab="reliability">Reliability</div>
                <div class="tab" data-tab="settings">Settings</div>
            </div>
            <div class="tab-content active" id="tab-tools"></div>
            <div class="tab-content" id="tab-desktop"></div>
            <div class="tab-content" id="tab-browser"></div>
            <div class="tab-content" id="tab-automation"></div>
            <div class="tab-content" id="tab-memory"></div>
            <div class="tab-content" id="tab-plans"></div>
            <div class="tab-content" id="tab-notifications"></div>
            <div class="tab-content" id="tab-reliability"></div>
            <div class="tab-content" id="tab-settings"></div>
        </aside>
    </div>

    <div class="overlay" id="confirm-overlay">
        <div class="confirm-modal">
            <div class="title">⚠ Action requires your approval</div>
            <div id="confirm-list"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
